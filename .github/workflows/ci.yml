name: Validate public skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate example tree
        run: python scripts/validate_tree.py --codex-home examples/lean-sol-tree/codex-home --project examples/lean-sol-tree/project
      - name: Scan publishable files
        run: python scripts/public_hygiene.py
